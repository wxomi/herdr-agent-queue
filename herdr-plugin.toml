id = "wxomi.agent-queue"
name = "Agent Attention Queue"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Hybrid keyboard-reflex and autopilot attention queue for AI agents across workspaces and machines"
platforms = ["linux", "macos"]

[[actions]]
id = "next"
title = "Jump to next agent in attention queue"
contexts = ["global"]
command = ["./run.sh", "next"]

[[actions]]
id = "prev"
title = "Jump to previous agent in attention queue"
contexts = ["global"]
command = ["./run.sh", "prev"]

[[actions]]
id = "toggle"
title = "Toggle autopilot auto-advance on reply"
contexts = ["global"]
command = ["./run.sh", "toggle"]

[[actions]]
id = "status"
title = "Show attention queue status"
contexts = ["global"]
command = ["./run.sh", "status"]

[[startup]]
command = ["./run.sh", "--watch"]
